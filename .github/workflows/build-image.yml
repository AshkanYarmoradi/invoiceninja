name: Build patched image

# Builds the Huisscan-patched Invoice Ninja image (docker/Dockerfile).
# - On pull_request: builds WITHOUT pushing, so the PR proves the patch still
#   applies to the pinned base image before anyone merges.
# - On push to the default branch (i.e. after a PR merge) or manual dispatch:
#   builds and pushes to GHCR for Coolify to pull.

on:
  pull_request:
    paths:
      - 'docker/**'
      - '.github/workflows/build-image.yml'
  push:
    branches: [ v5-stable ]
    paths:
      - 'docker/**'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase owner (GHCR requires lowercase)
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Read pinned Invoice Ninja version
        id: ver
        run: echo "in_version=$(grep -oP 'ARG IN_VERSION=\K[^\s]+' docker/Dockerfile)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (push only on non-PR events)
        uses: docker/build-push-action@v6
        with:
          context: docker
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/invoiceninja:${{ steps.ver.outputs.in_version }}
            ghcr.io/${{ steps.owner.outputs.owner }}/invoiceninja:latest
